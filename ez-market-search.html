<script>
(function(){
  try{
    var t = localStorage.getItem('ez-theme');
    if(!t){ t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();

<style>
  :root{
    --ink:#1A1A1A; --ink-soft:#6B6B6B; --surface:#FFFFFF; --surface-alt:#FAF5F5;
    --border:#F1D9DB; --primary:#C8102E; --primary-dark:#8E0B21; --primary-tint:#FBE4E7;
    --accent:#E63946; --accent-tint:#FDEBEC; --sale:#B3121F; --sale-tint:#F8DEE0; --star:#E63946;
    --shadow-sm:0 4px 14px rgba(20,40,34,.06); --shadow-md:0 14px 34px rgba(20,40,34,.10);
    --radius-card:18px; --radius-pill:999px; --radius-sm:12px;
    --font:'Cairo','Tahoma',system-ui,sans-serif; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F5EBEC; --ink-soft:#C9A8AC; --surface:#1A0E10; --surface-alt:#241316;
      --border:#3D1F23; --primary:#FF3B4E; --primary-dark:#E01F35; --primary-tint:#3D1418;
      --accent:#FF6B76; --accent-tint:#3A1519; --sale:#FF5C6C; --sale-tint:#3A1418; --star:#FF6B76;
      --shadow-sm:0 4px 14px rgba(0,0,0,.35); --shadow-md:0 14px 34px rgba(0,0,0,.45); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F5EBEC; --ink-soft:#C9A8AC; --surface:#1A0E10; --surface-alt:#241316;
    --border:#3D1F23; --primary:#FF3B4E; --primary-dark:#E01F35; --primary-tint:#3D1418;
    --accent:#FF6B76; --accent-tint:#3A1519; --sale:#FF5C6C; --sale-tint:#3A1418; --star:#FF6B76;
    --shadow-sm:0 4px 14px rgba(0,0,0,.35); --shadow-md:0 14px 34px rgba(0,0,0,.45); color-scheme:dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font); background:var(--surface-alt); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased; padding-bottom:64px;}
  a{color:inherit; text-decoration:none;}
  button, input{font-family:var(--font); cursor:pointer;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 20px;}
  .icon{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; flex-shrink:0;}

  header{position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border);}
  .header-top{display:flex; align-items:center; gap:14px; padding:14px 20px; max-width:1160px; margin:0 auto;}
  .logo{font-weight:800; font-size:1.3rem; color:var(--primary); white-space:nowrap;}
  .logo span.dot{color:var(--accent);}
  .search-bar{flex:1; display:flex; align-items:center; gap:10px; background:var(--surface-alt); border:1px solid var(--primary); border-radius:var(--radius-pill); padding:9px 16px; max-width:560px;}
  .search-bar input{border:none; background:none; outline:none; width:100%; color:var(--ink); font-family:var(--font); font-size:.92rem;}
  .search-bar .icon{color:var(--primary);}
  .header-actions{margin-inline-start:auto; display:flex; gap:6px;}
  .icon-btn{display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink);}
  @media (max-width:760px){ .search-bar{max-width:none;} .logo{display:none;} }

  .result-head{padding:22px 0 4px;}
  .result-head h1{font-size:1.2rem; font-weight:800;}
  .result-head h1 b{color:var(--primary);}
  .result-head p{font-size:.84rem; color:var(--ink-soft); margin-top:4px;}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-top:18px; overflow-x:auto;}
  .tab-btn{padding:12px 16px; font-size:.85rem; font-weight:700; color:var(--ink-soft); border-bottom:2px solid transparent; white-space:nowrap; background:none; border-top:none; border-inline:none; display:flex; align-items:center; gap:6px;}
  .tab-btn.active{color:var(--primary); border-color:var(--primary);}
  .tab-btn .n{font-size:.7rem; background:var(--surface-alt); color:var(--ink-soft); padding:1px 7px; border-radius:99px;}
  .tab-btn.active .n{background:var(--primary-tint); color:var(--primary);}

  .tab-panel{display:none; padding:22px 0 40px;}
  .tab-panel.active{display:block;}

  .suggest-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .suggest-row span{font-size:.8rem; color:var(--ink-soft); align-self:center;}
  .suggest-row button{padding:6px 14px; border-radius:var(--radius-pill); border:1px solid var(--border); background:var(--surface); font-size:.78rem; font-weight:600; color:var(--ink);}
  .suggest-row button:hover{border-color:var(--primary); color:var(--primary);}

  /* Category & store mini results */
  .mini-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  @media (max-width:760px){ .mini-grid{grid-template-columns:repeat(2,1fr);} }
  .mini-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; display:flex; align-items:center; gap:12px; transition:box-shadow .2s, transform .2s;}
  .mini-card:hover{box-shadow:var(--shadow-sm); transform:translateY(-2px);}
  .mini-card .ic{width:44px; height:44px; border-radius:12px; background:var(--primary-tint); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0;}
  .mini-card b{font-size:.86rem; display:block;}
  .mini-card span{font-size:.74rem; color:var(--ink-soft);}

  .section-label{font-size:.94rem; font-weight:800; margin-bottom:14px;}

  .grid{display:grid; gap:18px; grid-template-columns:repeat(4,1fr);}
  @media (max-width:1000px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:700px){ .grid{grid-template-columns:repeat(2,1fr);} }
  .product-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); overflow:hidden; transition:box-shadow .3s, transform .3s;}
  .product-card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px);}
  .product-media{position:relative; aspect-ratio:1/1; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:2.8rem;}
  .badge{position:absolute; top:10px; right:10px; font-size:.66rem; font-weight:800; padding:4px 9px; border-radius:var(--radius-pill); background:var(--sale-tint); color:var(--sale);}
  .product-info{padding:12px 14px 14px;}
  .store-name{font-size:.7rem; color:var(--ink-soft); font-weight:600;}
  .product-name{font-size:.87rem; font-weight:700; margin-top:2px;}
  .rating{display:flex; align-items:center; gap:4px; font-size:.74rem; color:var(--ink-soft); margin-top:4px;}
  .rating .stars{color:var(--star); display:flex; gap:1px;}
  .price-now{font-weight:800; color:var(--primary); font-size:.94rem; display:block; margin-top:4px;}

  .empty-state{text-align:center; padding:70px 20px;}
  .empty-state .emoji{font-size:3.6rem; margin-bottom:14px;}
  .empty-state h2{font-size:1.1rem; font-weight:800; margin-bottom:8px;}
  .empty-state p{color:var(--ink-soft); font-size:.86rem; margin-bottom:20px;}
  .empty-state a{display:inline-block; background:var(--primary); color:#fff; padding:11px 24px; border-radius:var(--radius-pill); font-weight:700; font-size:.86rem;}

  footer{background:var(--ink); color:var(--surface-alt); padding:30px 0; margin-top:20px; text-align:center; font-size:.8rem;}

  /* ===== هوية الهيدر: خلفية حمراء كاملة + شعار مميز ===== */
  header, header.scrolled{
    background:linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 65%, #E63946 100%) !important;
    border-bottom:1px solid rgba(255,255,255,.18) !important;
  }
  .logo{ display:flex; align-items:center; gap:10px; }
  .site-logo-img{ height:38px; width:auto; max-width:160px; object-fit:contain; }
  .logo, header .logo{
    font-family:'Poppins','Cairo','Tahoma',sans-serif !important;
    font-weight:800 !important; font-style:italic;
    font-size:1.9rem !important; letter-spacing:-.5px !important;
    color:#FFFFFF !important; text-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .logo span.dot, header .logo span.dot{ color:#FFE3E6 !important; font-style:normal; }
  header .search-bar{
    background:#FFFFFF !important; border:1px solid rgba(255,255,255,.6) !important;
  }
  header .search-bar input{ color:var(--ink) !important; }
  header .search-bar input::placeholder{ color:var(--ink-soft) !important; opacity:1; }
  header .search-bar .icon{ color:var(--primary) !important; }
  header .icon-btn, .header-actions .icon-btn{
    background:rgba(255,255,255,.16) !important; border:1px solid rgba(255,255,255,.4) !important;
    color:#FFFFFF !important;
  }
  header .icon-btn:hover{ background:rgba(255,255,255,.3) !important; }
  header .icon-btn .badge{ background:#FFFFFF !important; color:var(--sale) !important; }
  .cats-nav{ border-top:1px solid rgba(255,255,255,.22) !important; background:transparent !important; }
  .cats-nav a{ color:rgba(255,255,255,.92) !important; font-weight:700 !important; }
  .cats-nav a:hover{ color:#FFFFFF !important; text-decoration:underline; }
  .mobile-search .search-bar{ background:#FFFFFF !important; }
  @media (max-width:760px){ .logo{ font-size:1.5rem !important; } }

  /* ===== Mobile hardening (100% phone compatibility) ===== */
  html{ overflow-x:hidden; }
  body{ overflow-x:hidden; max-width:100vw; }
  @media (max-width:600px){
    input, select, textarea{ font-size:16px !important; }
  }
  @media (max-width:380px){
    .wrap{ padding:0 12px; }
  }
</style>
<style id="rv-style">
  .reveal-up{opacity:0; transform:translateY(34px); transition:opacity .75s cubic-bezier(.16,.84,.44,1), transform .75s cubic-bezier(.16,.84,.44,1); will-change:opacity,transform;}
  .reveal-up.in-view{opacity:1; transform:translateY(0);}
  .reveal-right{opacity:0; transform:translateX(56px); transition:opacity .75s cubic-bezier(.16,.84,.44,1), transform .75s cubic-bezier(.16,.84,.44,1); will-change:opacity,transform;}
  .reveal-right.in-view{opacity:1; transform:translateX(0);}
  .reveal-scale{opacity:0; transform:scale(.8); transition:opacity .6s cubic-bezier(.16,.84,.44,1), transform .6s cubic-bezier(.16,.84,.44,1); will-change:opacity,transform;}
  .reveal-scale.in-view{opacity:1; transform:scale(1);}
  .reveal-word-wrap .reveal-word{display:inline-block; opacity:0; transform:translateY(20px); transition:opacity .5s cubic-bezier(.16,.84,.44,1), transform .5s cubic-bezier(.16,.84,.44,1);}
  .reveal-word-wrap.in-view .reveal-word{opacity:1; transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){
    .reveal-up,.reveal-right,.reveal-scale,.reveal-word-wrap .reveal-word{opacity:1 !important; transform:none !important; transition:none !important;}
  }
</style>

<script>
(function(){
  "use strict";

  function starsHtml(rating, size){
    size = size || 12;
    var full = Math.round(rating);
    var html = '';
    for(var i=0;i<5;i++){
      html += '<svg class="icon" style="width:'+size+'px;height:'+size+'px;'+(i<full?'fill:var(--star);stroke:var(--star)':'fill:none;stroke:var(--border)')+'"><use href="#i-star"/></svg>';
    }
    return html;
  }

  var products = [
    {name:"سماعة بلوتوث إلغاء ضوضاء", store:"متجر الصوتيات", price:399, old:499, rating:4.6, reviews:860, emoji:"🎧", tint:"--accent-tint", badge:"خصم"},
    {name:"سماعة رأس للألعاب", store:"متجر الصوتيات", price:349, old:null, rating:4.5, reviews:96, emoji:"🎮", tint:"--primary-tint", badge:"جديد"},
    {name:"سماعة أذن رياضية مقاومة للماء", store:"متجر التقنية", price:149, old:199, rating:4.3, reviews:210, emoji:"🎧", tint:"--sale-tint", badge:"خصم"}
  ];

  var categories = [
    {name:"الصوتيات والسماعات", count:48, emoji:"🎧"}
  ];

  var stores = [
    {name:"متجر الصوتيات", count:62, rating:4.7, emoji:"🎧"}
  ];

  function productCard(p){
    var badgeHtml = p.badge ? '<span class="badge">'+p.badge+'</span>' : '';
    return (
      '<a href="ez-market-product.html" class="product-card">'+
        '<div class="product-media" style="background:var('+p.tint+')">'+badgeHtml+p.emoji+'</div>'+
        '<div class="product-info">'+
          '<div class="store-name">'+p.store+'</div>'+
          '<div class="product-name">'+p.name+'</div>'+
          '<div class="rating">'+starsHtml(p.rating)+'<span>'+p.rating+' ('+p.reviews+')</span></div>'+
          '<span class="price-now">'+p.price+' ر.س</span>'+
        '</div>'+
      '</a>'
    );
  }
  function catCard(c){
    return '<a href="ez-market-products.html" class="mini-card"><div class="ic">'+c.emoji+'</div><div><b>'+c.name+'</b><span>'+c.count+' منتج</span></div></a>';
  }
  function storeCard(s){
    return '<a href="ez-market-store.html" class="mini-card"><div class="ic"><svg class="icon" style="width:20px;height:20px"><use href="#i-store"/></svg></div><div><b>'+s.name+'</b><span>⭐ '+s.rating+' — '+s.count+' منتج</span></div></a>';
  }

  document.getElementById('all-products').innerHTML = products.map(productCard).join('');
  document.getElementById('only-products').innerHTML = products.map(productCard).join('');
  document.getElementById('cat-results').innerHTML = categories.map(catCard).join('');
  document.getElementById('only-categories').innerHTML = categories.map(catCard).join('');
  document.getElementById('store-results').innerHTML = stores.map(storeCard).join('');
  document.getElementById('only-stores').innerHTML = stores.map(storeCard).join('');

  window.setTab = function(name, btn){
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    document.getElementById('tab-'+name).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  };

  /* Reflect the ?q= query param coming from other pages' search bars */
  var params = new URLSearchParams(window.location.search);
  var q = params.get('q');
  if(q && q.trim()){
    document.getElementById('search-input').value = q;
    document.getElementById('q-label').textContent = q;
    document.title = 'نتائج البحث عن "' + q + '" — EZ Market';
  }
})();
</script>
<script>
(function(){
  function syncIcon(){
    var theme = document.documentElement.getAttribute('data-theme') || 'light';
    var use = document.querySelector('#theme-icon use');
    if(use){ use.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon'); }
  }
  window.toggleTheme = function(){
    var current = document.documentElement.getAttribute('data-theme') || 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('ez-theme', next); }catch(e){}
    syncIcon();
  };
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', syncIcon);
  } else {
    syncIcon();
  }
})();
</script>
<script id="rv-script">

  var SCALE_SEL = '.product-card,.store-card,.order-card,.order-row-card,.promo-card';
  var CANDIDATE_SEL = [
    '.product-card','.cat-card','.store-card','.promo-card','.review-card',
    '.order-card','.order-row-card','.summary-card','.stat-card','.panel',
    '.section-head','.page-title','.empty-state','.table-wrap','.breadcrumb',
    '.grid > *','.cats-grid > *','.promo-grid > *','.stat-grid > *',
    '.trust-grid > *','.form-grid > *','.hero-inner > *'
  ].join(',');
  var HEADING_SEL = '.section-head,.page-title,h1,h2';
  var rvIdx = 0;

  var rvIo = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');

      }
    });
  }, {threshold:0.12, rootMargin:'0px 0px -40px 0px'}) : null;

  function rvObserve(el){
    if(rvReduce || !rvIo){ el.classList.add('in-view'); return; }
    rvIo.observe(el);
  }

  function rvWrapWords(el){
    var text = el.textContent.trim();
    if(!text) return;
    var words = text.split(/\s+/);
    el.innerHTML = words.map(function(w, i){
      return '<span class="reveal-word" style="transition-delay:'+(i*0.045)+'s">'+w+'</span>';
    }).join(' ');
    el.classList.add('reveal-word-wrap');
    rvObserve(el);
  }

  function rvTag(el){
    if(!el || el.nodeType !== 1 || el.hasAttribute('data-rv')) return;
    if(el.closest && el.closest('nav, header, footer, .theme-fab, script, style')) return;
    el.setAttribute('data-rv','1');
    var wordCount = (el.textContent || '').trim().split(/\s+/).length;
    if(el.matches(SCALE_SEL)){
      el.classList.add('reveal-scale');
      el.style.transitionDelay = (0.04 * (rvIdx % 6)) + 's';
      rvIdx++;
      rvObserve(el);
    } else if(el.matches(HEADING_SEL) && wordCount > 0 && wordCount <= 10 && el.children.length === 0){
      rvWrapWords(el);
    } else {
      el.classList.add(rvIdx % 2 === 0 ? 'reveal-up' : 'reveal-right');
      el.style.transitionDelay = (0.05 * (rvIdx % 5)) + 's';
      rvIdx++;
      rvObserve(el);
    }
  }

  function rvScan(root){
    if(!root || !root.querySelectorAll) return;
    root.querySelectorAll(CANDIDATE_SEL).forEach(rvTag);
  }

  rvScan(document);

  if('MutationObserver' in window){
    var rvMo = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes && m.addedNodes.forEach(function(n){
          if(n.nodeType !== 1) return;
          if(n.matches && n.matches(CANDIDATE_SEL)) rvTag(n);
          rvScan(n);
        });
      });
    });
    rvMo.observe(document.body, {childList:true, subtree:true});
  }
})();
</script>
</body>
</html>
